    <h1>Contact</h1>
    <p>Reach out for opportunities, questions, or just to connect</p>
  </header>

  <main>
    <div class="contact-wrapper">

      <div class="contact-info">
        <p><strong>Email:</strong> <a href="jrmcadam9696@gmail.com">jrmcadam9696@gmail.com</a></p>
        <p><strong>Location:</strong> Philadelphia, PA</p>
        <p><strong>LinkedIn:</strong> <a href="https://www.linkedin.com/in/jason-mcadam/">https://www.linkedin.com/in/jason-mcadam/</a></p>
      </div>

      <form action="#" method="post">
        <div>
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your full name" required />
        </div>
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="your@email.com" required />
        </div>
        <div>
          <label for="subject">Subject</label>
          <input type="text" id="subject" name="subject" placeholder="What is this about?" />
        </div>
        <div>
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Your message..." required></textarea>
        </div>
        <button type="submit">Send Message</button>
      </form>

    </div>
  </main>
